name: Playwright Tests
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        env:
            BASE_URL: ${{ secrets.BASE_URL }}
            ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        steps:
            # ── Stage 1: Environment Setup ────────────────────────────────
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Install Allure commandline
              run: npm install -g allure-commandline --save-dev
            - name: Start SUT via Docker
              run: docker compose -f ${{ github.workspace }}/SUT/docker-compose.yml up -d ea_api ea_webapp

            # ── Stage 2: Test Execution & Reporting ───────────────────────
            - name: Run Playwright tests
              run: npm run test
            - name: Generate Allure Report
              if: ${{ !cancelled() }}
              run: allure generate reports/allure-results --clean -o reports/allure-report
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: reports/playwright-report/
                  retention-days: 30
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: allure-report
                  path: reports/allure-report/
                  retention-days: 30
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: test-results
                  path: reports/test-results/
                  retention-days: 30
