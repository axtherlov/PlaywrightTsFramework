name: Playwright Tests
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        env:
            RUNNER: ${{ secrets.RUNNER }}
            TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
            TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Install Allure commandline.
              run: npm install -g allure-commandline --save-dev
            - name: Install SUT with docker
              run: docker compose -f ${{ github.workspace }}/SUT/docker-compose.yml up -d ea_api ea_webapp
            - name: Run Playwright tests
              run: npm run test
            - name: Generate Allure Report
              run: |
                  allure generate reports/allure-results --clean -o reports/allure-report 
                  allure open -h 127.0.0.1 -p 5060 reports/allure-report &
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: reports/playwright-report/
                  retention-days: 30
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: allure-report
                  path: reports/allure-report/
                  retention-days: 30
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: test-results
                  path: reports/test-results/
                  retention-days: 30
